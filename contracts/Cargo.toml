[workspace]
members = [
    "malicious-contract",
    "vesting-vault"
]
# Excluded work-in-progress contracts that do not compile and block the build:
#
# - merkle_vault (issue #51): pins a different soroban-sdk major than the
#   workspace and uses APIs that don't type-check (env.crypto().sha256() returns
#   Hash<32>, not BytesN<32>, and env.serialize() is not a soroban-sdk method).
#
# - reentrancy-tests: mis-architected. It is declared as a #[contract] but its
#   methods use test-only APIs (Address::generate, register_contract,
#   ledger().set_timestamp) that are unavailable in a deployable contract, and
#   it hand-rolls contract clients that conflict with the SDK-generated ones.
#   The reentrancy checks belong in a #[cfg(test)] module that uses the
#   generated clients, not in a contract. Needs a rewrite by the contracts team.
#
# Move each back into `members` once it compiles.
exclude = [
    "merkle_vault",
    "reentrancy-tests"
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
overflow-checks = true
