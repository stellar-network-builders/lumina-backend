[workspace]
members = [
    "malicious-contract",
    "vesting-vault"
]
# Excluded from the workspace build because these crates do not currently
# compile against the workspace's soroban-sdk. They are skipped in CI (see the
# e2e-pipeline and smart-contract-tests workflows) until they are reworked.
#
# - merkle_vault: work-in-progress (issue #51); pins a different soroban-sdk
#   major and uses APIs that don't type-check (env.crypto().sha256() returns
#   Hash<32>, not BytesN<32>, and env.serialize() is not a soroban-sdk method).
# - reentrancy-tests: mis-architected WIP crate (60+ type errors against
#   soroban-sdk 21); pending a rewrite as a #[cfg(test)] module that uses the
#   SDK-generated contract clients. Was previously (incorrectly) listed under
#   `members`, which broke the workspace build.
#
# Move each back into `members` once it compiles.
exclude = [
    "merkle_vault",
    "reentrancy-tests"
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "21.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
overflow-checks = true
